name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Verze tagu (např. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend & Capacitor Sync
        working-directory: frontend
        run: npm run build:android

      - name: Make Gradle executable
        run: chmod +x frontend/android/gradlew

      - name: Build Release APK with Gradle
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK for release
        run: |
          mkdir -p release-assets
          cp frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk release-assets/PokeGO-Event-Tracker.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/PokeGO-Event-Tracker.apk
          name: ${{ github.ref_name != 'main' && github.ref_name || inputs.version_tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
