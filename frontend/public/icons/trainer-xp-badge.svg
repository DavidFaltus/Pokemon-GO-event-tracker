<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="xpGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#aa3bff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#060709" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- Inner Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#171921"/>
    </linearGradient>

    <!-- XP Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#facc15" flood-opacity="0.35"/>
    </filter>

    <!-- Text Glow Filter -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#b45309" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Badge -->
  <circle cx="128" cy="128" r="120" fill="url(#xpGlow)"/>

  <!-- Outer Golden Gear/Shield Circle -->
  <g filter="url(#badgeShadow)">
    <!-- Base Outer Disc -->
    <circle cx="128" cy="128" r="102" fill="url(#ringGrad)"/>
    <circle cx="128" cy="128" r="95" fill="#171921"/>

    <!-- Inner Metallic Ring -->
    <circle cx="128" cy="128" r="91" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>
    <circle cx="128" cy="128" r="84" fill="url(#shieldGrad)"/>

    <!-- Decorative Circuit / Hex lines -->
    <circle cx="128" cy="128" r="82" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
  </g>

  <!-- Star Sparkles Around Ring -->
  <path d="M128 32 L131 42 L141 45 L131 48 L128 58 L125 48 L115 45 L125 42 Z" fill="#ffffff" filter="drop-shadow(0 0 4px #facc15)"/>
  <path d="M208 90 L210 96 L216 98 L210 100 L208 106 L206 100 L200 98 L206 96 Z" fill="#ffffff" filter="drop-shadow(0 0 3px #facc15)"/>
  <path d="M48 160 L50 166 L56 168 L50 170 L48 176 L46 170 L40 168 L46 166 Z" fill="#ffffff" filter="drop-shadow(0 0 3px #facc15)"/>

  <!-- Stylized "XP" Typography -->
  <g filter="url(#textGlow)">
    <!-- X Character -->
    <path d="M 52 86 L 76 86 L 94 122 L 112 86 L 136 86 L 107 132 L 138 182 L 114 182 L 94 144 L 74 182 L 50 182 L 81 132 Z" 
          fill="url(#textGrad)" 
          stroke="#78350f" 
          stroke-width="3" 
          stroke-linejoin="round"/>
    
    <!-- P Character -->
    <path d="M 144 86 L 186 86 C 206 86, 218 97, 218 116 C 218 135, 206 146, 186 146 L 166 146 L 166 182 L 144 182 Z M 166 104 L 166 128 L 183 128 C 193 128, 198 123, 198 116 C 198 109, 193 104, 183 104 Z" 
          fill="url(#textGrad)" 
          stroke="#78350f" 
          stroke-width="3" 
          stroke-linejoin="round"/>
  </g>

  <!-- Top Gloss Highlight on Letters -->
  <path d="M 55 89 L 74 89 L 94 120 L 114 89 L 133 89 L 108 126 L 102 121 L 118 93 L 110 93 L 94 120 L 78 93 L 70 93 L 88 121 Z" fill="#ffffff" opacity="0.65"/>
  <path d="M 147 89 L 185 89 C 195 89, 203 93, 208 99 C 204 94, 196 92, 185 92 L 149 92 Z" fill="#ffffff" opacity="0.75"/>

  <!-- Ribbon Banner at Bottom with "LEVEL 80" -->
  <g filter="drop-shadow(0 4px 8px rgba(0,0,0,0.6))">
    <!-- Ribbon Wings -->
    <path d="M 38 206 L 58 194 L 58 218 Z" fill="#7e22ce"/>
    <path d="M 218 206 L 198 194 L 198 218 Z" fill="#7e22ce"/>
    
    <!-- Ribbon Front -->
    <rect x="52" y="194" width="152" height="26" rx="6" fill="linear-gradient(90deg, #aa3bff 0%, #7e22ce 100%)" stroke="#c084fc" stroke-width="1.5"/>
    
    <!-- Ribbon Text -->
    <text x="128" y="212" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="13" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="2">
      LEVEL 1–80
    </text>
  </g>

  <!-- Radiant Sparkle on Top-Right of Ribbon -->
  <polygon points="198,190 200,194 204,196 200,198 198,202 196,198 192,196 196,194" fill="#facc15"/>
</svg>
